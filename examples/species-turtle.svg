  <rect class="pf-tint" x="12" y="141" width="200" height="37" fill="#79b865"/>
  
  <path fill="#5fa8d3" d="M142 150h56v14h-56zM148 148h44v2h-44zM148 164h44v2h-44z"/><path fill="#9fd0ec" d="M154 153h12v2h-12z"/><path fill="#3f8f4f" d="M176 154h10v5h-10z"/><path fill="#ff8fa3" d="M179 153h3v2h-3z"/><path fill="#2c6b3a" d="M200 128h2v22h-2zM204 128h2v22h-2z"/><path fill="#8a5a33" d="M200 124h2v5h-2zM204 124h2v5h-2z"/>
