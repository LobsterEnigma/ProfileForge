<svg xmlns="http://www.w3.org/2000/svg" class="pf" width="480" height="190" viewBox="0 0 480 190" role="img" aria-labelledby="pf-title pf-desc">
<title id="pf-title">Pinchy, demo&#39;s ProfileForge pet</title>
<desc id="pf-desc">Level 9 Berserker crab, feeling happy. 12-day streak.</desc>
<style>.pf{--pf-bg:#ffffff;--pf-border:#d0d7de;--pf-title:#1f2328;--pf-text:#1f2328;--pf-muted:#656d76;--pf-accent:#cf4a1f;--pf-bar-empty:#eaeef2;--pf-hp:#2da44e;--pf-exp:#0969da;--pf-sky-top:#bfe3ff;--pf-sky-bottom:#fdf3dc;--pf-ground:#f0d09a;--pf-ground-dark:#d6ae72;--pf-stars:0;--pf-city-sky-top:#4b5aa8;--pf-city-sky-bottom:#ffb38a;--pf-city-text:#ffffff;--pf-city-muted:#e8e6ff;--pf-bldg1:#2f3354;--pf-bldg2:#3b4066;--pf-bldg3:#262a45;--pf-window-on:#ffd166;--pf-window-alt:#ffe8a3;--pf-window-off:#4a5078;--pf-road:#23263b;--pf-celestial:#ff8a5c}@media (prefers-color-scheme:dark){.pf{--pf-bg:#0d1117;--pf-border:#30363d;--pf-title:#e6edf3;--pf-text:#e6edf3;--pf-muted:#8d96a0;--pf-accent:#ff8a5c;--pf-bar-empty:#21262d;--pf-hp:#3fb950;--pf-exp:#58a6ff;--pf-sky-top:#0a1630;--pf-sky-bottom:#23305a;--pf-ground:#3d3526;--pf-ground-dark:#2b251b;--pf-stars:1;--pf-city-sky-top:#070f24;--pf-city-sky-bottom:#1f2c55;--pf-city-text:#e6edf3;--pf-city-muted:#9fb0d0;--pf-bldg1:#161d33;--pf-bldg2:#1d2640;--pf-bldg3:#121829;--pf-window-on:#ffd166;--pf-window-alt:#9ad1ff;--pf-window-off:#26304d;--pf-road:#0e1322;--pf-celestial:#f4f1de}}
.pf-name{font:700 20px 'Segoe UI',Ubuntu,'Helvetica Neue',sans-serif;fill:var(--pf-title)}
.pf-class{font:700 13px 'Segoe UI',Ubuntu,'Helvetica Neue',sans-serif}
.pf-accent{fill:var(--pf-accent)}
.pf-muted{fill:var(--pf-muted);font-weight:400}
.pf-label{font:700 11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:var(--pf-muted)}
.pf-value{font:400 11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:var(--pf-text)}
.pf-stat{font:700 16px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:var(--pf-text)}
.pf-mood{font:400 12px 'Segoe UI',Ubuntu,'Helvetica Neue',sans-serif;fill:var(--pf-muted)}

.pf-fa{animation:pf-a 1s steps(1) infinite}
.pf-fb{opacity:0;animation:pf-b 1s steps(1) infinite}
@keyframes pf-a{0%{opacity:1}50%{opacity:0}100%{opacity:0}}
@keyframes pf-b{0%{opacity:0}50%{opacity:1}100%{opacity:1}}
.pf-blink-open{animation:pf-blink-open 4.2s steps(1) infinite}
.pf-blink-shut{opacity:0;animation:pf-blink-shut 4.2s steps(1) infinite}
@keyframes pf-blink-open{0%{opacity:1}94%{opacity:0}98%{opacity:1}100%{opacity:1}}
@keyframes pf-blink-shut{0%{opacity:0}94%{opacity:1}98%{opacity:0}100%{opacity:0}}
.pf-bob{animation:pf-bob 2s ease-in-out infinite}
@keyframes pf-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}

.pf-walk{animation:pf-walk 9s ease-in-out infinite}
@keyframes pf-walk{0%,100%{transform:translateX(-34px)}40%,50%{transform:translateX(34px)}90%{transform:translateX(-34px)}}
.pf-jump{animation:pf-jump .9s ease-in-out infinite}
@keyframes pf-jump{0%,70%,100%{transform:translateY(0)}10%{transform:translateY(2px)}40%{transform:translateY(-16px)}}
.pf-shadow{transform-box:fill-box;transform-origin:center}
.pf-jump-shadow{animation:pf-jump-shadow .9s ease-in-out infinite}
@keyframes pf-jump-shadow{0%,70%,100%{transform:scaleX(1);opacity:.35}40%{transform:scaleX(.55);opacity:.15}}
.pf-breathe{transform-box:fill-box;transform-origin:50% 100%;animation:pf-breathe 3.2s ease-in-out infinite}
@keyframes pf-breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.93)}}
.pf-shiver{animation:pf-shiver 2.6s linear infinite}
@keyframes pf-shiver{0%,60%,80%,100%{transform:translateX(0)}64%,72%{transform:translateX(-2px)}68%,76%{transform:translateX(2px)}}
.pf-wobble{transform-box:fill-box;transform-origin:50% 100%;animation:pf-wobble 2.4s ease-in-out infinite}
@keyframes pf-wobble{0%,55%,100%{transform:rotate(0)}65%{transform:rotate(-9deg)}75%{transform:rotate(8deg)}85%{transform:rotate(-4deg)}92%{transform:rotate(2deg)}}
.pf-rise{animation:pf-rise 2.7s ease-out infinite}
@keyframes pf-rise{0%{transform:translate(0,0);opacity:0}15%{opacity:1}100%{transform:translate(8px,-38px);opacity:0}}
.pf-twinkle{transform-box:fill-box;transform-origin:center;animation:pf-twinkle 1.8s ease-in-out infinite}
@keyframes pf-twinkle{0%,100%{opacity:.15;transform:scale(.5)}50%{opacity:1;transform:scale(1)}}
.pf-star{opacity:var(--pf-stars)}
@media (prefers-reduced-motion:reduce){.pf *{animation:none!important}}
</style>

<rect width="480" height="190" rx="10" style="fill:var(--pf-bg)"/>
<rect x=".5" y=".5" width="479" height="189" rx="10" fill="none" style="stroke:var(--pf-border)"/>

<defs>
  <clipPath id="pf-clip"><rect x="12" y="12" width="200" height="166" rx="8"/></clipPath>
  <linearGradient id="pf-sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" style="stop-color:var(--pf-sky-top)"/>
    <stop offset="1" style="stop-color:var(--pf-sky-bottom)"/>
  </linearGradient>
</defs>
<g clip-path="url(#pf-clip)">
  <rect x="12" y="12" width="200" height="166" fill="url(#pf-sky)"/>
  <g class="pf-star"><rect class="pf-twinkle" style="animation-delay:-0s" x="28" y="26" width="3" height="3" fill="#fff"/><rect class="pf-twinkle" style="animation-delay:-0.7s" x="62" y="44" width="3" height="3" fill="#fff"/><rect class="pf-twinkle" style="animation-delay:-1.3s" x="96" y="22" width="3" height="3" fill="#fff"/><rect class="pf-twinkle" style="animation-delay:-0.4s" x="138" y="38" width="3" height="3" fill="#fff"/><rect class="pf-twinkle" style="animation-delay:-1.1s" x="178" y="24" width="3" height="3" fill="#fff"/><rect class="pf-twinkle" style="animation-delay:-0.2s" x="196" y="56" width="3" height="3" fill="#fff"/><rect class="pf-twinkle" style="animation-delay:-1.5s" x="44" y="70" width="3" height="3" fill="#fff"/></g>
  <rect x="12" y="144" width="200" height="34" style="fill:var(--pf-ground)"/>
  <path d="M12 144h8v-3h-8zM28 144h8v-3h-8zM44 144h8v-3h-8zM60 144h8v-3h-8zM76 144h8v-3h-8zM92 144h8v-3h-8zM108 144h8v-3h-8zM124 144h8v-3h-8zM140 144h8v-3h-8zM156 144h8v-3h-8zM172 144h8v-3h-8zM188 144h8v-3h-8zM204 144h8v-3h-8z" style="fill:var(--pf-ground)"/>
  <rect x="34" y="158" width="6" height="4" style="fill:var(--pf-ground-dark)"/><rect x="162" y="164" width="6" height="4" style="fill:var(--pf-ground-dark)"/><rect x="108" y="168" width="6" height="4" style="fill:var(--pf-ground-dark)"/><rect x="188" y="154" width="6" height="4" style="fill:var(--pf-ground-dark)"/>
  <g>
  <g class=""><rect class="pf-shadow pf-jump-shadow" x="88" y="145" width="48" height="6" rx="3" opacity=".35" style="fill:var(--pf-ground-dark)"/><g transform="translate(82 108)"><g class="pf-jump"><g class="pf-fa" style="animation-duration:0.6s"><path fill="#4a1c14" d="M0 3h6v3h-6zM9 3h6v3h-6zM0 6h3v3h-3zM12 6h3v3h-3zM0 9h3v3h-3zM12 9h3v3h-3zM0 12h3v3h-3zM12 12h3v3h-3zM3 15h9v3h-9zM45 3h6v3h-6zM54 3h6v3h-6zM45 6h3v3h-3zM57 6h3v3h-3zM45 9h3v3h-3zM57 9h3v3h-3zM45 12h3v3h-3zM57 12h3v3h-3zM48 15h9v3h-9zM12 18h3v3h-3zM45 18h3v3h-3zM6 33h3v3h-3zM12 33h3v3h-3zM45 33h3v3h-3zM51 33h3v3h-3zM3 36h3v3h-3zM12 36h3v3h-3zM45 36h3v3h-3zM54 36h3v3h-3z"/><path fill="#ff9a76" d="M3 6h3v3h-3zM3 9h3v3h-3zM54 6h3v3h-3zM54 9h3v3h-3z"/><path fill="#e8553a" d="M9 6h3v3h-3zM6 9h6v3h-6zM3 12h9v3h-9zM48 6h3v3h-3zM48 9h6v3h-6zM48 12h9v3h-9z"/></g><g class="pf-fb" style="animation-duration:0.6s"><path fill="#4a1c14" d="M3 3h9v3h-9zM0 6h3v3h-3zM12 6h3v3h-3zM0 9h3v3h-3zM12 9h3v3h-3zM0 12h3v3h-3zM12 12h3v3h-3zM3 15h9v3h-9zM48 3h9v3h-9zM45 6h3v3h-3zM57 6h3v3h-3zM45 9h3v3h-3zM57 9h3v3h-3zM45 12h3v3h-3zM57 12h3v3h-3zM48 15h9v3h-9zM12 18h3v3h-3zM45 18h3v3h-3zM6 33h3v3h-3zM12 33h3v3h-3zM45 33h3v3h-3zM51 33h3v3h-3zM3 36h3v3h-3zM12 36h3v3h-3zM45 36h3v3h-3zM54 36h3v3h-3z"/><path fill="#ff9a76" d="M3 6h3v3h-3zM54 6h3v3h-3z"/><path fill="#e8553a" d="M6 6h6v3h-6zM3 9h9v3h-9zM3 12h9v3h-9zM48 6h6v3h-6zM48 9h9v3h-9zM48 12h9v3h-9z"/></g><path fill="#4a1c14" d="M18 18h24v3h-24zM15 21h3v3h-3zM42 21h3v3h-3zM12 24h3v3h-3zM45 24h3v3h-3zM12 27h3v3h-3zM45 27h3v3h-3zM15 30h3v3h-3zM42 30h3v3h-3zM18 33h24v3h-24z"/><path fill="#e8553a" d="M18 21h3v3h-3zM27 21h15v3h-15zM15 24h3v3h-3zM21 24h24v3h-24zM15 27h30v3h-30zM24 30h12v3h-12z"/><path fill="#ff9a76" d="M21 21h6v3h-6zM18 24h3v3h-3z"/><path fill="#b53a24" d="M18 30h6v3h-6zM36 30h6v3h-6z"/><path fill="#4a1c14" d="M24 24h3v3h-3zM33 24h3v3h-3zM27 27h6v3h-6z"/><path fill="#ff8fa3" d="M15 27h6v3h-6zM39 27h6v3h-6z"/><path fill="#4a1c14" d="M15 0h12v3h-12zM15 3h3v3h-3zM24 3h3v3