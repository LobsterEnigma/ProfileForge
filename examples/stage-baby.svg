  <g class="pf-rise" style="animation-delay:-0.3s"><path fill="#ff5c7a" d="M88 108h4v2h-4zM94 108h4v2h-4zM88 110h10v2h-10zM90 112h6v2h-6zM92 114h2v2h-2z"/></g><g class="pf-rise" style="animation-delay:-1.2s"><path fill="#ff5c7a" d="M112 102h4v2h-4zM118 102h4v2h-4zM112 104h10v2h-10zM114 106h6v2h-6zM116 108h2v2h-2z"/></g><g class="pf-rise" style="animation-delay:-2.1s"><path fill="#ff5c7a" d="M133 112h4v2h-4zM139 112h4v2h-4zM133 114h10v2h-10zM135 116h6v2h-6zM137 118h2v2h-2z"/></g>
  </g>
</g>

<g>
  <text x="230" y="40" class="pf-name">Pinchy</text>
  <text x="230" y="61" class="pf-class"><tspan class="pf-accent">Lv.9 Berserker</tspan><tspan class="pf-muted"> · Rust</tspan></text>
  
  <text x="230" y="88" class="pf-label">HP</text><rect x="260" y="79" width="12" height="10" rx="1.5" style="fill:var(--pf-hp)"/><rect x="274" y="79" width="12" height="10" rx="1.5" style="fill:var(--pf-hp)"/><rect x="288" y="79" width="12" height="10" rx="1.5" style="fill:var(--pf-hp)"/><rect x="302" y="79" width="12" height="10" rx="1.5" style="fill:var(--pf-hp)"/><rect x="316" y="79" width="12" height="10" rx="1.5" style="fill:var(--pf-hp)"/><rect x="330" y="79" width="12" height="10" rx="1.5" style="fill:var(--pf-hp)"/><rect x="344" y="79" width="12" height="10" rx="1.5" style="fill:var(--pf-hp)"/><rect x="358" y="79" width="12" height="10" rx="1.5" style="fill:var(--pf-hp)"/><rect x="372" y="79" width="12" height="10" rx="1.5" style="fill:var(--pf-hp)"/><rect x="386" y="79" width="12" height="10" rx="1.5" style="fill:var(--pf-bar-empty)"/>
  <text x="464" y="88" class="pf-value" text-anchor="end">13/14d</text>
  
