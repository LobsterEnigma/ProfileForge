  <text x="230" y="128" class="pf-label">STR</text><text x="230" y="147" class="pf-stat">27</text><text x="290" y="128" class="pf-label">INT</text><text x="290" y="147" class="pf-stat">20</text><text x="350" y="128" class="pf-label">CHA</text><text x="350" y="147" class="pf-stat">14</text><text x="410" y="128" class="pf-label">DEX</text><text x="410" y="147" class="pf-stat">17</text>
