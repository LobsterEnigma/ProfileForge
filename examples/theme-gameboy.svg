<svg xmlns="http://www.w3.org/2000/svg" class="pf" width="480" height="190" viewBox="0 0 480 190" role="img" aria-labelledby="pf-title pf-desc">
<title id="pf-title">Pinchy, demo&#39;s ProfileForge pet</title>
<desc id="pf-desc">Level 27 Berserker crab, feeling idle. 1-day streak.</desc>
<style>.pf{--pf-bg:#9bbc0f;--pf-border:#306230;--pf-title:#0f380f;--pf-text:#0f380f;--pf-muted:#306230;--pf-accent:#0f380f;--pf-bar-empty:#8bac0f;--pf-hp:#306230;--pf-exp:#0f380f;--pf-sky-top:#8bac0f;--pf-sky-bottom:#9bbc0f;--pf-ground:#306230;--pf-ground-dark:#0f380f;--pf-stars:0;--pf-city-sky-top:#8bac0f;--pf-city-sky-bottom:#9bbc0f;--pf-city-text:#0f380f;--pf-city-muted:#306230;--pf-bldg1:#306230;--pf-bldg2:#0f380f;--pf-bldg3:#306230;--pf-window-on:#9bbc0f;--pf-window-alt:#8bac0f;--pf-window-off:#0f380f;--pf-road:#0f380f;--pf-celestial:#306230}
.pf-name{font:700 20px 'Segoe UI',Ubuntu,'Helvetica Neue',sans-serif;fill:var(--pf-title)}
.pf-class{font:700 13px 'Segoe UI',Ubuntu,'Helvetica Neue',sans-serif}
.pf-accent{fill:var(--pf-accent)}
.pf-muted{fill:var(--pf-muted);font-weight:400}
.pf-label{font:700 11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:var(--pf-muted)}
.pf-value{font:400 11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:var(--pf-text)}
.pf-stat{font:700 16px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:var(--pf-text)}
.pf-mood{font:400 12px 'Segoe UI',Ubuntu,'Helvetica Neue',sans-serif;fill:var(--pf-muted)}

.pf-fa{animation:pf-a 1s steps(1) infinite}
.pf-fb{opacity:0;animation:pf-b 1s steps(1) infinite}
@keyframes pf-a{0%{opacity:1}50%{opacity:0}100%{opacity:0}}
@keyframes pf-b{0%{opacity:0}50%{opacity:1}100%{opacity:1}}
.pf-blink-open{animation:pf-blink-open 4.2s steps(1) infinite}
.pf-blink-shut{opacity:0;animation:pf-blink-shut 4.2s steps(1) infinite}
@keyframes pf-blink-open{0%{opacity:1}94%{opacity:0}98%{opacity:1}100%{opacity:1}}
@keyframes pf-blink-shut{0%{opacity:0}94%{opacity:1}98%{opacity:0}100%{opacity:0}}
.pf-bob{animation:pf-bob 2s ease-in-out infinite}
@keyframes pf-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}

.pf-walk{animation:pf-walk 9s ease-in-out infinite}
@keyframes pf-walk{0%,100%{transform:translateX(-34px)}40%,50%{transform:translateX(34px)}90%{transform:translateX(-34px)}}
.pf-jump{animation:pf-jump .9s ease-in-out infinite}
@keyframes pf-jump{0%,70%,100%{transform:translateY(0)}10%{transform:translateY(2px)}40%{transform:translateY(-16px)}}
.pf-shadow{transform-box:fill-box;transform-origin:center}
.pf-jump-shadow{animation:pf-jump-shadow .9s ease-in-out infinite}
@keyframes pf-jump-shadow{0%,70%,100%{transform:scaleX(1);opacity:.35}40%{transform:scaleX(.55);opacity:.15}}
.pf-breathe{transform-box:fill-box;transform-origin:50% 100%;animation:pf-breathe 3.2s ease-in-out infinite}
@keyframes pf-breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.93)}}
.pf-shiver{animation:pf-shiver 2.6s linear infinite}
@keyframes pf-shiver{0%,60%,80%,100%{transform:translateX(0)}64%,72%{transform:translateX(-2px)}68%,76%{transform:translateX(2px)}}
.pf-wobble{transform-box:fill-box;transform-origin:50% 100%;animation:pf-wobble 2.4s ease-in-out infinite}
@keyframes pf-wobble{0%,55%,100%{transform:rotate(0)}65%{transform:rotate(-9deg)}75%{transform:rotate(8deg)}85%{transform:rotate(-4deg)}92%{transform:rotate(2deg)}}
.pf-rise{animation:pf-rise 2.7s ease-out infinite}
@keyframes pf-rise{0%{transform:translate(0,0);opacity:0}15%{opacity:1}100%{transform:translate(8px,-38px);opacity:0}}
.pf-twinkle{transform-box:fill-box;transform-origin:center;animation:pf-twinkle 1.8s ease-in-out infinite}
@keyframes pf-twinkle{0%,100%{opacity:.15;transform:scale(.5)}50%{opacity:1;transform:scale(1)}}
.pf-star{opacity:var(--pf-stars)}
@media (prefers-reduced-motion:reduce){.pf *{animation:none!important}}
</style>
<defs><filter id="pf-theme" color-interpolation-filters="sRGB">
  <feColorMatrix type="matrix" values=".299 .587 .114 0 0 .299 .587 .114 0 0 .299 .587 .114 0 0 0 0 0 1 0"/>
  <feComponentTransfer>
    <feFuncR type="discrete" tableValues=".059 .188 .545 .608"/>
    <feFuncG type="discrete" tableValues=".22 .384 .675 .737"/>
    <feFuncB type="discrete" tableValues=".059 .188 .059 .059"/>
  </feComponentTransfer>
</filter></defs>
<rect width="480" height="190" rx="10" style="fill:var(--pf-bg)"/>
<rect x=".5" y=".5" width="479" height="189" rx="10" fill="none" style="stroke:var(--pf-border)"/>

<defs>
  <clipPath id="pf-clip"><rect x="12" y="12" width="200" height="166" rx="8"/></clipPath>
  <linearGradient id="pf-sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" style="stop-color:var(--pf-sky-top)"/>
    <stop offset="1" style="stop-color:var(--pf-sky-bottom)"/>
  </linearGradient>
</defs>
<g clip-path="url(#pf-clip)">
  <rect x="12" y="12" width="200" height="166" fill="url(#pf-sky)"/>
  <g class="pf-star"><rect class="pf-twinkle" style="animation-delay:-0s" x="28" y="26" width="3" height="3" fill="#fff"/><rect class="pf-twinkle" style="animation-delay:-0.7s" x="62" y="44" width="3" height="3" fill="#fff"/><rect class="pf-twinkle" style="animation-delay:-1.3s" x="96" y="22" width="3" height="3" fill="#fff"/><rect class="pf-twinkle" style="animation-delay:-0.4s" x="138" y="38" width="3" height="3" fill="#fff"/><rect class="pf-twinkle" style="animation-delay:-1.1s" x="178" y="24" width="3" height="3" fill="#fff"/><rect class="pf-twinkle" style="animation-delay:-0.2s" x="196" y="56" width="3" height="3" fill="#fff"/><rect class="pf-twinkle" style="animation-delay:-1.5s" x="44" y="70" width="3" height="3" fill="#fff"/></g>
  <rect x="12" y="144" width="200" height="34" style="fill:var(--pf-ground)"/>
  <path d="M12 144h8v-3h-8zM28 144h8v-3h-8zM44 144h8v-3h-8zM60 144h8v-3h-8zM76 144h8v-3h-8zM92 144h8v-3h-8zM108 144h8v-3h-8zM124 144h8v-3h-8zM140 144h8v-3h-8zM156 144h8v-3h-8zM172 144h8v-3h-8zM188 144h8v-3h-8zM204 144h8v-3h-8z" style="fill:var(--pf-ground)"/>
  <rect x="34" y="158" width="6" height="4" style="fill:var(--pf-ground-dark)"/><rect x="162" y="164" width="6" height="4" style="fill:var(--pf-ground-dark)"/><rect x="108" y="168" width="6" height="4" style="fill:var(--pf-ground-dark)"/><rect x="188" y="154" width="6" height="4" style="fill:var(--pf-ground-dark)"/>
  <g filter="url(#pf-theme)">
  <g class="pf-walk"><rect class="pf-shadow" x="80" y="146" width="64" height="6" rx="3" opacity=".35" style="fill:var(--pf-ground-dark)"/><g transform="translate(72 96)"><g class=""><g class="pf-fa" style="animation-duration:0.48s"><path fill="#4a1c14" d="M0 4h8v4h-8zM12 4h8v4h-8zM0 8h4v4h-4zM16 8h4v4h-4zM0 12h4v4h-4zM16 12h4v4h-4zM0 16h4v4h-4zM16 16h4v4h-4zM4 20h12v4h-12zM60 4h8v4h-8zM72 4h8v4h-8zM60 8h4v4h-4zM76 8h4v4h-4zM60 12h4v4h-4zM76 12h4v4h-4zM60 16h4v4h-4zM76 16h4v4h-4zM64 20h12v4h-12zM16 24h4v4h-4zM60 24h4v4h-4zM8 44h4v4h-4zM16 44h4v4h-4zM60 44h4v4h-4zM68 44h4v4h-4zM4 48h4v4h-4zM16 48h4v4h-4zM60 48h4v4h-4zM72 48h4v4h-4z"/><path fill="#ff9a76" d="M4 8h4v4h-4zM4 12h4v4h-4zM72 8h4v4h-4zM72 12h4v4h-4z"/><path fill="#e8553a" d="M12 8h4v4h-4zM8 12h8v4h-8zM4 16h12v4h-12zM64 8h4v4h-4zM64 12h8v4h-8zM64 16h12v4h-12z"/></g><g class="pf-fb" style="animation-duration:0.48s"><path fill="#4a1c14" d="M0 4h8v4h-8zM12 4h8v4h-8zM0 8h4v4h-4zM16 8h4v4h-4zM0 12h4v4h-4zM16 12h4v4h-4zM0 16h4v4h-4zM16 16h4v4h-4zM4 20h12v4h-12zM60 4h8v4h-8zM72 4h8v4h-8zM60 8h4v4h-4zM76 8h4v4h-4zM60 12h4v4h-4zM76 12h4v4h-4zM60 16h4v4h-4zM76 16h4v4h-4zM64 20h12v4h-12zM16 24h4v4h-4zM60 24h4v4h-4zM12 44h8v4h-8zM60 44h8v4h-8zM8 48h4v4h-4zM20 48h4v4h-4zM56 48h4v4h-4zM68 48h4v4h-4z"/><path fill="#ff9a76" d="M4 8h4v4h-4zM4 12h4v4h-4zM72 8h4v4h-4zM72 12h4v4h-4z"/><path fill="#e8553a" d="M12 8h4v4h-4zM8 12h8v4h-8zM4 16h12v4h-12zM64 8h4v4h-4zM64 12h8v4h-8zM64 16h12v4h-12z"/></g><path fill="#4a1c14" d="M24 24h32v4h-32zM20 28h4v4h-4zM56 28h4v4h-4zM16 32h4v4h-4zM60 32h4v4h-4zM16 36h4v4h-4zM60 36h4v4h-4zM20 40h4v4h-4zM56 40h4v4h-4zM24 44h32v4h-32z"/><path fill="#e8553a" d="M24 28h4v4h-4zM36 28h20v4h-20zM20 32h4v4h-4zM28 32h32v4h-32zM20 36h40v4h-40zM32 40h16v4h-16z"/><path fill="#ff9a76" d="M28 28h8v4h-8zM24 32h4v4h-4z"/><path fill="#b53a24" d="M24 40h8v4h-8zM48 40h8v4h-8z"/><path fill="#4a1c14" d="M32 32h4v4h-4zM44 32h4v4h-4zM36 36h8v4h-8z"/><g class="pf-blink-open"><path fill="#4a1c14" d="M20 0h16v4h-16zM20 4h4v4h-4zM32 4h4v4h-4zM20 8h4v4h-4zM32 8h4v4h-4zM20 12h16v4h-16zM44 0h16v4h-16zM44 4h4v4h-4zM56 4h4v4h-4zM44 8h4v4h-4zM56 8h4v4h-4zM44 12h16v4h-16zM28 16h4v4h-4zM28 20h4v4h-4zM48 16h4v4h-4zM48 20h4v4h-4z"/><path fill="#ffffff" d="M24 4h4v4h-4zM24 8h8v4h-8zM48 4h4v4h-4zM48 8h8v4h-8z"/><path fill="#1a1a1a" d="M28 4h4v4h-4zM52 4h4v4h-4z"/></g><g class="pf-blink-shut"><path fill="#4a1c14" d="M24 12h8v4h-8zM20 16h4v4h-4zM32 16h4v4h-4zM20 20h16v4h-16zM48 12h8v4h-8zM44 16h4v4h-4zM56 16h4v4h-4zM44 20h16v4h-16z"/><path fill="#e8553a" d="M24 16h8v4h-8zM48 16h8v4h-8z"/></g></g></g></g>
  
  </g>
</g>

<g>
  <text x="230" y="40" class="pf-name">Pinchy</text>
  <text x="230" y="61" class="pf-class"><tspan class="pf-accent">Lv.27 Berserker</tspan><tspan class="pf-muted"> · Rust</tspan></text>
  
  <text x="230" y="88" class="pf-label">HP</text><rect x="260" y="79" width="12" height="10" rx="1.5" style="fill:var(--pf-hp)"/><rect x="274" y="79" width="12" height="10" rx="1.5" style="fill:var(--pf-hp)"/><rect x="288" y="79" width="12" height="10" rx="1.5" style="fill:var(--pf-hp)"/><rect x="302" y="79" width="12" height="10" rx="1.5" style="fill:var(--pf-hp)"/><rect x="316" y="79" width="12" height="10" rx="1.5" style="fill:var(--pf-bar-empty)"/><rect x="330" y="79" width="12" height="10" rx="1.5" style="fill:var(--pf-bar-empty)"/><rect x="344" y="79" width="12" height="10" rx="1.5" style="fill:var(--pf-bar-empty)"/><rect x="358" y="79" width="12" height="10" rx="1.5" style="fill:var(--pf-bar-empty)"/><rect x="372" y="79" width="12" height="10" rx="1.5" style="fill:var(--pf-bar-empty)"/><rect x="386" y="79" width="12" height="10" rx="1.5" style="fill:var(--pf-bar-empty)"/>
  <text x="464" y="88" class="pf-value" text-anchor="end">6/14d</text>
  
  <text x="230" y="108" class="pf-label">EXP</text><rect x="260" y="99" width="12" height="10" rx="1.5" style="fill:var(--pf-exp)"/><rect x="274" y="99" width="12" height="10" rx="1.5" style="fill:var(--pf-exp)"/><rect x="288" y="99" width="12" height="10" rx="1.5" style="fill:var(--pf-exp)"/><rect x="302" y="99" width="12" height="10" rx="1.5" style="fill:var(--pf-exp)"/><rect x="316" y="99" width="12" height="10" rx="1.5" style="fill:var(--pf-exp)"/><rect x="330" y="99" width="12" height="10" rx="1.5" style="fill:var(--pf-exp)"/><rect x="344" y="99" width="12" height="10" rx="1.5" style="fill:var(--pf-bar-empty)"/><rect x="358" y="99" width="12" height="10" rx="1.5" style="fill:var(--pf-bar-empty)"/><rect x="372" y="99" width="12" height="10" rx="1.5" style="fill:var(--pf-bar-empty)"/><rect x="386" y="99" width="12" height="10" rx="1.5" style="fill:var(--pf-bar-empty)"/>
  <text x="464" y="108" class="pf-value" text-anchor="end">3.5k/3.6k</text>
  <text x="230" y="128" class="pf-label">STR</text><text x="230" y="147" class="pf-stat">40</text><text x="290" y="128" class="pf-label">INT</text><text x="290" y="147" class="pf-stat">31</text><text x="350" y="128" class="pf-label">CHA</text><text x="350" y="147" class="pf-stat">27</text><text x="410" y="128" class="pf-label">DEX</text><text x="410" y="147" class="pf-stat">26</text>
  <text x="230" y="174" class="pf-mood">Idle · just vibing</text>
</g>
</svg>