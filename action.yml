name: ProfileForge Pet
description: Animated pixel widgets for your GitHub profile README, a pet that lives on your commits and a city built from them.
author: LobsterEnigma
branding:
  icon: heart
  color: orange

inputs:
  github_user_name:
    description: Whose pet to render. Defaults to the repository owner.
    default: ${{ github.repository_owner }}
  github_token:
    description: Token used to read public contribution data. The built-in token is enough.
    default: ${{ github.token }}
  outputs:
    description: |
      One SVG per line as `path?params`, using the same params as the API
      (widget, name, theme, hide_border, species, pet, season, hemisphere). Examples:
      `profileforge/pet.svg?name=Pinchy&theme=dark`, `profileforge/city.svg?widget=city`
    default: profileforge/pet.svg
  care:
    description: |
      "true" lets visitors feed, bathe and play with your pet by opening issues titled
      "ProfileForge: feed" (or bath, play). Needs `issues: write` and an `issues: [opened]`
      trigger; see the README. Off by default.
    default: "false"
  care_file:
    description: Where the care log is kept (a .json file in your repo).
    default: profileforge/care.json
  commit:
    description: Commit and push the generated SVGs. Set to "false" to handle that yourself.
    default: "true"
  commit_message:
    description: Message for the commit.
    default: "chore: feed the ProfileForge pet"

outputs:
  mood:
    description: happy, idle, hungry or sleeping
  level:
    description: Pet level (1–99)
  stage:
    description: egg, baby, adult or legendary

runs:
  using: node24
  main: dist/action.js
